# LiteLLM Enterprise Gateway / Proxy Configuration
# Routes requests to local Ollama on Apple Silicon Metal GPU with centralized rate limiting,
# caching, and failover capabilities.

model_list:
  - model_name: qwen3.5:4b
    litellm_params:
      model: ollama_chat/qwen3.5:4b
      api_base: http://localhost:11434
      extra_body:
        think: false
  - model_name: llama3.2:3b
    litellm_params:
      model: ollama_chat/llama3.2:3b
      api_base: http://localhost:11434
      extra_body:
        think: false
  - model_name: gemini-2.5-flash
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY

router_settings:
  model_group_alias:
    "default": "qwen3.5:4b"
    "copilot": "qwen3.5:4b"
    "evaluator": "llama3.2:3b"
    "judge": "llama3.2:3b"

general_settings:
  master_key: sk-litellm-proxy-token

litellm_settings:
  drop_params: true
  telemetry: false
  cache_params:
    type: "in-memory"
