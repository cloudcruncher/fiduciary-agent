[project]
name = "fiduciary"
version = "0.1.0"
description = "Personal Fiduciary Agent Harness - UK Financial Intelligence & Capital Optimization"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "rich>=13.0.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "pyjwt[crypto]>=2.8.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
    "google-genai>=2.26.0",
    "pypdf>=6.19.0",
]

[project.scripts]
fiduciary = "fiduciary.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fiduciary"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
]
ignore = [
    "E501",  # line length (handled by soft wrap)
    "W291",  # trailing whitespace in embedded HTML/PDF templates
    "W293",  # blank line whitespace in embedded HTML templates
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::starlette.testclient.StarletteDeprecationWarning",
]
