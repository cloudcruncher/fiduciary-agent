    .text-dim { font-size: 12px; fill: #8b949e; }
    .text-green { font-size: 12.5px; font-weight: 600; fill: #3fb950; }
    .text-yellow { font-size: 12.5px; font-weight: 600; fill: #d29922; }
    .text-cyan { font-size: 12.5px; font-weight: 600; fill: #79c0ff; }
    .text-purple { font-size: 12.5px; font-weight: 600; fill: #d2a8ff; }
    .badge { font-size: 11px; font-weight: 700; text-transform: uppercase; }
