    <text x="16" y="56" class="font-mono text-dim">• Faithfulness &amp; Grounding: <tspan class="text-green">1.00 / 1.00</tspan> (Zero arithmetic or balance hallucination)</text>
    <text x="16" y="74" class="font-mono text-dim">• Fiduciary Soundness:     <tspan class="text-green">0.95 / 1.00</tspan> (Emergency buffer prioritized before spend authorization)</text>
